# Block Tags
# This file is used to create some tags the plugin uses.
# Modify this to your liking but be very careful when you do.
#
# This accepts both Minecraft block types `minecraft:stone`
# and block tags prefixed with `#`, ex: `#minecraft:logs` (minecraft or custom)
#
# The names of these sections double as tags.
# Example `requires_shovel` = `#survival_plus:requires_shovel`

